AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  VayuDrishti (वायुदृष्टि) - Hyperlocal Clean-Air & School Safe-Passage AI Grid
  Built for WeMakeDevs x AWS Bharat Builds Tour: Environmental Hacks (Track 01: Air)

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Environment:
      Variables:
        DYNAMODB_TABLE_REPORTS: !Ref ReportsTable
        DYNAMODB_TABLE_TELEMETRY: !Ref TelemetryTable
        SNS_TOPIC_ARN: !Ref EmergencyAlertsTopic
        BEDROCK_MODEL_ID: anthropic.claude-3-5-sonnet-20240620-v1:0

Resources:
  # ==========================================
  # 1. DynamoDB Tables
  # ==========================================
  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: VayuDrishti_Reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  TelemetryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: VayuDrishti_Telemetry
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stationId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: stationId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  # ==========================================
  # 2. Amazon SNS Emergency Topic
  # ==========================================
  EmergencyAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: VayuDrishti_Emergency_Alerts
      DisplayName: VayuDrishti GRAP Emergency Notification Service

  # ==========================================
  # 3. AWS Lambda Ingestion & AI Functions
  # ==========================================
  TelemetryIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      InlineCode: |
        const { DynamoDBClient } = require("@aws-sdk/client-dynamodb");
        const { DynamoDBDocumentClient, PutCommand } = require("@aws-sdk/lib-dynamodb");
        const client = new DynamoDBClient({});
        const doc = DynamoDBDocumentClient.from(client);
        exports.handler = async (event) => {
          console.log("Telemetry ingested from NASA FIRMS & CPCB sensors");
          return { statusCode: 200, body: JSON.stringify({ message: "Telemetry processed" }) };
        };
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TelemetryTable
      Events:
        HourlyCron:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Ingest NASA FIRMS & CPCB every hour

  SchoolSafetyAlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      InlineCode: |
        const { SNSClient, PublishCommand } = require("@aws-sdk/client-sns");
        const sns = new SNSClient({});
        exports.handler = async (event) => {
          console.log("06:00 AM Dawn Inversion Check for GRAP Stage IV");
          return { statusCode: 200, body: JSON.stringify({ status: "Dispatched" }) };
        };
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt EmergencyAlertsTopic.TopicName
      Events:
        DawnInversionCron:
          Type: Schedule
          Properties:
            Schedule: cron(30 0 * * ? *) # 06:00 AM IST (00:30 UTC)
            Description: Dawn inversion check for school safety protocols

  BedrockAdvisoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      InlineCode: |
        exports.handler = async (event) => {
          return { statusCode: 200, body: JSON.stringify({ message: "Bedrock Advisory Route" }) };
        };
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"

Outputs:
  ReportsTableName:
    Description: DynamoDB Reports Table
    Value: !Ref ReportsTable

  EmergencyAlertsTopicArn:
    Description: SNS Emergency Broadcast Topic ARN
    Value: !Ref EmergencyAlertsTopic
